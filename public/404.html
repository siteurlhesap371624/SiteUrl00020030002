<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Marul AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        var l = window.location
        var segmentCount = 0
        var path = l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~')
        var search = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : ''
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' + path + search + l.hash)
      })()
    </script>
  </head>
  <body>
    <p>Yönlendiriliyor...</p>
  </body>
</html>
